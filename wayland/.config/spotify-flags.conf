# Keep Spotify off XWayland. An XWayland client cannot use
# wp_fractional_scale_v1, so at a fractional monitor scale it is rendered at an
# integer scale and downscaled, which is the blurry-text effect.
#
# Only Spotify needs this file. Omarchy's default/hypr/envs.lua already exports
# ELECTRON_OZONE_PLATFORM_HINT=wayland and OZONE_PLATFORM=wayland, which every
# Electron app honours. Spotify embeds CEF instead, which reads neither, so it
# needs the switch spelled out.
--ozone-platform=wayland
