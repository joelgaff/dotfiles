# Render natively on Wayland rather than through XWayland. XWayland clients
# cannot use wp_fractional_scale_v1, so at a fractional monitor scale they are
# rendered at an integer scale and downscaled -- which is the blurry-text
# effect. Native Wayland clients render at the exact scale and stay sharp.
#
# "hint=auto" rather than a hard "--ozone-platform=wayland" so the app still
# starts under X11 if there is ever no Wayland display.
--ozone-platform-hint=auto
