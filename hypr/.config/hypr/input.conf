# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt. 
  # Swap alt and framework key  
  # kb_layout = us,dk,eu
  kb_layout = us
  kb_options = compose:caps, altwin:swap_alt_win # ,grp:alts_toggle


 # Swap Alt and Super keys for Lofree Flow 84 (Mac-style layout)
  # This makes the physical Command key act as Super and Option key act as Alt
#  kb_model = pc105
#  kb_options = compose:caps,altwin:swap_alt_win


  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 600

  # Increase sensitity for mouse/trackpack (default: 0)
  # sensitivity = 0.35

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4

    # Enable the touchpad while typing
    # disable_while_typing = false

    # Left-click-and-drag with three fingers
    # drag_3fg = 1

  }
}

# Scroll faster in the terminal
windowrule = match:class (Alacritty|kitty), scroll_touchpad 1.5
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.2


# Enable touchpad gestures for changing workspaces
# See https://wiki.hyprland.org/Configuring/Gestures/
# gesture = 3, horizontal, workspace

# MacBook Pro internal keyboard — Command is already Super, no swap needed
device {
    name = apple-spi-keyboard
    kb_layout = us
    kb_options = compose:caps
}

# Lofree Flow84 - Win mode + altwin swap for Mac-style modifiers and working PrtSc
device {
    name = compx-flow84@lofree
    kb_layout = us
    kb_options = compose:caps, altwin:swap_alt_win
}

device {
    name = compx-flow84@lofree-2
    kb_layout = us
    kb_options = compose:caps, altwin:swap_alt_win
}

device {
    name = compx-flow84@lofree-1
    kb_layout = us
    kb_options = compose:caps, altwin:swap_alt_win
}
