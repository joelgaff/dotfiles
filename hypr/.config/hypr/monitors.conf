# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2
monitor=,preferred,auto,auto

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.666667

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

##############################################################


# Framework 13 w/ Samsung 32" external monitor
 monitor = DP-4, 3840x2160@60, auto-center-up, 1.5 # F13 port 1, far left
 monitor = DP-3, 3840x2160@60, auto-center-up, 1.5 # F13 port 2, near left
 monitor = eDP-1, 2880x1920@120, auto-center-down, 2


# workspaces 1-5 always on eDP-1
 workspace = 1, monitor:eDP-1, default:true, persistent:true
 workspace = 2, monitor:eDP-1, persistent:true
 workspace = 3, monitor:eDP-1, persistent:true
 workspace = 4, monitor:eDP-1, persistent:true
 workspace = 5, monitor:eDP-1, persistent:true

# external monitors
 workspace = 6, monitor:DP-3
 workspace = 7, monitor:DP-3
 workspace = 8, monitor:DP-3
 workspace = 9, monitor:DP-3
 workspace = 10, monitor:DP-3

 workspace = 6, monitor:DP-4
 workspace = 7, monitor:DP-4
 workspace = 8, monitor:DP-4
 workspace = 9, monitor:DP-4
 workspace = 10, monitor:DP-4

# Toggle internal display with keybinding (SUPER CTRL + M)
 bind = SUPER CTRL, M, exec, ~/.config/hypr/scripts/toggle-internal-monitor.sh

# Clamshell mode - disabled because lid-closed causes heat/fan noise.
# To restore automatic clamshell behavior, uncomment the two bindl lines below.
# The clamshell.sh script is still intact and ready to use.
# bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/clamshell.sh close
# bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/clamshell.sh open


