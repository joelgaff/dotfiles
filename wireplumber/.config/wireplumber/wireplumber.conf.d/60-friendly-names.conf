# Friendly names for audio devices, shown everywhere (Mic FX, Omarchy audio
# menu, Monitor Mix, Zoom/OBS). Only the display name changes.
monitor.alsa.rules = [
  { matches = [ { node.name = "alsa_input.pci-0000_c1_00.6.HiFi__Headset__source" } ]
    actions = { update-props = { node.description = "Rode mic (3.5mm jack)" node.nick = "Rode mic" } } }
  { matches = [ { node.name = "~alsa_input.pci-0000_c1_00.6.HiFi__Mic.*" } ]
    actions = { update-props = { node.description = "Laptop mic" node.nick = "Laptop mic" } } }
  { matches = [ { node.name = "alsa_output.pci-0000_c1_00.6.HiFi__Headphones__sink" } ]
    actions = { update-props = { node.description = "Headphones (3.5mm jack)" node.nick = "Headphones" } } }
  { matches = [ { node.name = "alsa_output.pci-0000_c1_00.6.HiFi__Speaker__sink" } ]
    actions = { update-props = { node.description = "Laptop speakers" node.nick = "Laptop speakers" } } }
  { matches = [ { node.name = "~alsa_output.usb-KTMicro_KT_USB_Audio.*" } ]
    actions = { update-props = { node.description = "USB-C headphone adapter" node.nick = "USB-C adapter" } } }
  { matches = [ { node.name = "~alsa_input.usb-KTMicro_KT_USB_Audio.*" } ]
    actions = { update-props = { node.description = "USB-C adapter mic" node.nick = "USB-C adapter mic" } } }
  { matches = [ { node.name = "~alsa_input.usb-Insta360_Insta360_Link.*" } ]
    actions = { update-props = { node.description = "Insta360 camera mic" node.nick = "Insta360 mic" } } }
]

monitor.bluez.rules = [
  { matches = [ { node.name = "~bluez_output.C0_EA_C3_13_3F_B0.*" } ]
    actions = { update-props = { node.description = "Soundcore headphones" node.nick = "Soundcore" } } }
  { matches = [ { node.name = "~bluez_input.C0_EA_C3_13_3F_B0.*" } ]
    actions = { update-props = { node.description = "Soundcore headphones mic" node.nick = "Soundcore mic" } } }
]
