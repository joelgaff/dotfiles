## Keep microphone inputs powered instead of suspending them when idle.
##
## WirePlumber suspends an idle audio node after 5 seconds (see
## /usr/share/wireplumber/scripts/node/suspend-node.lua). Waking the ALSA
## capture device again costs roughly 75ms, and push-to-talk dictation pays
## that cost on every keypress: voxtype logs "Recording started", opens the
## device, and the first ~100ms of speech is gone before samples arrive.
## That is about one syllable, which is why the first word came out wrong.
##
## Applies to capture devices only. Outputs keep suspending normally, so
## the speakers still power down when nothing is playing.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
