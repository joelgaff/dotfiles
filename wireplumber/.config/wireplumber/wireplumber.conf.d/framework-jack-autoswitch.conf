# Framework 13 combo jack: headphones + mic while both are plugged in; just
# the mic (e.g. the Rode) + speakers when only a mic is; the laptop's speakers
# and internal stereo mic otherwise.
# WirePlumber picks the first profile in the list that is available, and
# re-picks whenever the jack is plugged or unplugged.
device.profile.priority.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_c1_00.6" } ]
    actions = {
      update-props = {
        priorities = [
          "HiFi (Headphones, Headset, Mic1)"
          "HiFi (Headset, Mic1, Speaker)"
          "HiFi (Mic1, Mic2, Speaker)"
        ]
      }
    }
  }
]

# Default device ranking: the jack's headset mic beats everything when plugged
# in, then the internal stereo mic beats the webcam mic. Headphones on the jack
# beat Bluetooth and HDMI while plugged in.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_input.pci-0000_c1_00.6.HiFi__Headset__source" } ]
    actions = { update-props = { priority.session = 2300 } }
  }
  {
    matches = [ { node.name = "alsa_input.pci-0000_c1_00.6.HiFi__Mic2__source" } ]
    actions = { update-props = { priority.session = 2200 } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c1_00.6.HiFi__Headphones__sink" } ]
    actions = { update-props = { priority.session = 1100 } }
  }
  # USB-C headphone adapter beats the jack whenever it's plugged in (the jack
  # may just have the Rode mic in it).
  {
    matches = [ { node.name = "~alsa_output.usb-KTMicro_KT_USB_Audio.*" } ]
    actions = { update-props = { priority.session = 1500 } }
  }
  # The Shure MV7+ on USB is the mic whenever it's plugged in.
  {
    matches = [ { node.name = "~alsa_input.usb-Shure_Inc_Shure_MV7.*" } ]
    actions = { update-props = { priority.session = 2300 } }
  }
]
