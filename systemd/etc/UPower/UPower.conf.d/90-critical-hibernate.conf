# Hibernate rather than die when the battery runs out, so an unattended
# machine keeps its session.
#
# This used to be a script hanging off omarchy-battery-monitor.service. Quattro
# folded battery monitoring into the shell and dropped that unit, which took the
# hibernate with it. upowerd already polls the battery for everything else --
# including what the omarchy bar reads -- so let it own the critical action too.
#
# Ordering matters: Low > Critical > Action. Critical moves to 10 so it still
# sits above the action, and matches the shell's own low-battery warning.

[UPower]
PercentageLow=20.0
PercentageCritical=10.0
PercentageAction=7.0
CriticalPowerAction=Hibernate
